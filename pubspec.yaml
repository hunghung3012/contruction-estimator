name: construction_estimator
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

   #UI
  cupertino_icons: ^1.0.8
  auto_size_text: ^3.0.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.3.1
  shimmer: ^3.0.0

  #camera
  image_picker: ^1.1.2
  permission_handler: ^12.0.1
  device_info_plus: ^11.5.0
  image_cropper: ^9.1.0

  #local storage
  shared_preferences: ^2.2.2
  rx_shared_preferences: ^3.1.0
  isar_community: 3.3.0
  isar_community_flutter_libs: 3.3.0

  #state management
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0

  dartx: ^1.2.0
  equatable: ^2.0.7
  collection: ^1.19.1
  rxdart: ^0.27.7
  http_parser: ^4.1.2

  #responsive
  flutter_screenutil: ^5.9.0

  #dependency injection
  get_it: ^7.6.8
  injectable: ^2.4.1

  #access environment variables in .env file
  flutter_dotenv: ^5.1.0

  #generation models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  #talker & logger
  talker_flutter: 4.5.4
  talker_bloc_logger: ^4.1.3
  talker_dio_logger: ^4.1.3

  #restful api
  dio: ^5.4.2+1
  retrofit: 4.9.2

  result_dart: ^1.1.1

  #router
  auto_route: ^10.1.1

  url_launcher: ^6.3.1

  path_provider: ^2.1.5

  uuid: ^4.5.3

  #languages 
  intl: ^0.20.2
  flutter_localization: ^0.3.0

dependency_overrides:
#   source_gen: ^4.0.0
#   dart_style: ^3.1.1
#   build: ^4.0.0
  # analyzer: ^8.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13 #^2.4.9
  freezed: ^3.2.0
  json_serializable: ^6.7.1
  auto_route_generator: ^10.2.4
  flutter_gen_runner: ^5.4.0
  intl_utils: ^2.8.7
  injectable_generator: ^2.6.1
  # retrofit_generator: ^10.0.3 #^10.2.3
  isar_community_generator: 3.3.0


flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto/Roboto-Medium.ttf
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
        - asset: assets/fonts/Roboto/Roboto-Thin.ttf

flutter_gen:
  output: lib/generated/
  integrations:
    flutter_svg: true
  assets:
    enabled: true
    outputs:
      package_parameter_enabled: false
      style: dot-delimiter
  fonts:
    enabled: true
  colors:
    enabled: true
    inputs:
      - assets/color/colors.xml

flutter_intl:
  enabled: true
  main_locale: "en"
  arb_dir: assets/l10n
  output_dir: lib/generated
